Diff_Drive:
  diff_drive_controller:
     type: "diff_drive_controller/DiffDriveController"
     publish_rate: 50

     # Đã sửa thành tên Joint mới từ file URDF
     left_wheel: ['Left_wheel_joint']
     right_wheel: ['Right_wheel_joint']

     # Đã tính toán lại từ tọa độ file 3D (Y_left - Y_right = 0.76308 - 0.18036 = 0.58272)
     wheel_separation: 0.58272 
     
     wheel_radius: 0.1   

     pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
     twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]

     # Top level frame (link) of the robot description
     base_frame_id: base_footprint
 
     # Velocity and acceleration limits for the robot
     linear:
       x:
         has_velocity_limits    : true
         max_velocity           : 1.57  # m/s
         has_acceleration_limits: true
         max_acceleration       : 1.8   # m/s^2
     angular:
       z:
         has_velocity_limits    : true
         max_velocity           : 3   # rad/s
         has_acceleration_limits: true
         max_acceleration       : 3   # rad/s^2